[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-mcp"
version = "0.1.0"
description = "MCP server for Amadeus flights with quota and cache safeguards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.12.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
amadeus-mcp = "amadeus_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
